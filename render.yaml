# Render: backend only (frontend on Vercel).
# In Render dashboard set: GEMINI_API_KEY, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, FRONTEND_URL (your Vercel URL), CORS_ORIGINS (same as FRONTEND_URL).
# Optional for a high traffic day: DRIVE_CONTEXT_SEARCH_ENABLED=false (skip automatic Drive search in chat).
# Optional: RATE_LIMIT_CHAT_MESSAGE, RATE_LIMIT_CHAT_CREATE, RATE_LIMIT_DRIVE_SYNC, RATE_LIMIT_DRIVE_SORT (e.g. "15/minute"); redeploy/restart to apply.
# Optional: RATE_LIMIT_RESET_SECRET — then POST https://<RENDER_URL>/api/admin/reset-rate-limits?token=<secret> clears shared IP buckets without restart.
services:
  - type: web
    name: aorta-backend
    plan: free
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: |
      export GOOGLE_REDIRECT_URI=${RENDER_EXTERNAL_URL}/api/drive/auth/callback
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
